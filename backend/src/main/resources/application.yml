server:
  # Render inyecta PORT; localmente se usa BACKEND_PORT o 8080
  port: ${PORT:${BACKEND_PORT:8080}}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  http2:
    enabled: true

spring:
  application:
    name: sig-backend
  datasource:
    # Render: DB_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sig_db}
    username: ${DB_USER:sig}
    password: ${DB_PASSWORD:sig}
  jpa:
    hibernate:
      # Flyway es la unica fuente de esquema; nunca update/create
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: sig
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sig
    default-schema: sig
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-super-secreta-en-produccion-min-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    remember-me-expiration-minutes: ${JWT_REMEMBER_ME_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,https://*.onrender.com}
  seed:
    enabled: ${SEED_ENABLED:true}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    allowed-emails: ${GOOGLE_ALLOWED_EMAILS:escuelaavescomercial@gmail.com,easpracticantes@gmail.com,escuelaavesdesalento@gmail.com}
    default-role: ${GOOGLE_DEFAULT_ROLE:GERENCIA}
  sheets:
    webapp-url: ${GOOGLE_SHEETS_WEBAPP_URL:https://script.google.com/macros/s/AKfycbwfFkKwgD5lPBGzrP8J477cKBrueQroZ6rW4c7XgU7ebMdRT1xlZFl6XoFgH29ugUObPg/exec}
    sync-interval-ms: ${SHEETS_SYNC_INTERVAL_MS:300000}
    write-token: ${GOOGLE_SHEETS_WRITE_TOKEN:}
  contabilidad:
    api-base: ${CONTABLE_API_BASE:http://localhost:8787}
    connect-timeout-seconds: ${CONTABLE_CONNECT_TIMEOUT_SECONDS:20}
    read-timeout-seconds: ${CONTABLE_READ_TIMEOUT_SECONDS:120}
  ai:
    provider: ${APP_AI_PROVIDER:gemini}
    quote:
      base-price-per-person: ${AI_QUOTE_BASE_PRICE:75000}
      min-confidence: ${AI_QUOTE_MIN_CONFIDENCE:25}
    gemini:
      # Nunca hardcodear la key: definir GEMINI_API_KEY en entorno / Render
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-latest,gemini-flash-latest}
      connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:15}
      read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
