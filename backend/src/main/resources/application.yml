server:
  # Render inyecta PORT; localmente se usa BACKEND_PORT o 8080
  port: ${PORT:${BACKEND_PORT:8080}}

spring:
  application:
    name: sig-backend
  datasource:
    # Render: DB_URL=jdbc:postgresql://HOST:5432/DB?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sig_db}
    username: ${DB_USER:sig}
    password: ${DB_PASSWORD:sig}
  jpa:
    hibernate:
      # Flyway es la unica fuente de esquema; nunca update/create
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: sig
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sig
    default-schema: sig
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-super-secreta-en-produccion-min-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    remember-me-expiration-minutes: ${JWT_REMEMBER_ME_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
  seed:
    enabled: ${SEED_ENABLED:true}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    allowed-emails: ${GOOGLE_ALLOWED_EMAILS:}
    default-role: ${GOOGLE_DEFAULT_ROLE:GERENCIA}
  sheets:
    webapp-url: ${GOOGLE_SHEETS_WEBAPP_URL:https://script.google.com/macros/s/AKfycbzMkCg7PfddRA048GAZBc5jz_2lKpmtJg13589XteWmONKBiQBQLKZxw-eBeEwa0uDslw/exec}
    sync-interval-ms: ${SHEETS_SYNC_INTERVAL_MS:300000}
  ai:
    quote:
      base-price-per-person: ${AI_QUOTE_BASE_PRICE:75000}
      min-confidence: ${AI_QUOTE_MIN_CONFIDENCE:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
