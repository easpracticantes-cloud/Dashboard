server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: sig-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sig_db}
    username: ${DB_USER:sig}
    password: ${DB_PASSWORD:sig}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_schema: sig
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-super-secreta-en-produccion-min-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    remember-me-expiration-minutes: ${JWT_REMEMBER_ME_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
  seed:
    enabled: ${SEED_ENABLED:true}
  google:
    # OAuth 2.0 Client ID (tipo "Aplicación web") de Google Cloud Console.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Correos y/o dominios autorizados, separados por coma.
    # Ej: jefa@gmail.com,coordinacion@gmail.com,@escuelaavessalento.com
    allowed-emails: ${GOOGLE_ALLOWED_EMAILS:}
    # Rol asignado a un usuario nuevo la primera vez que entra por Google.
    default-role: ${GOOGLE_DEFAULT_ROLE:GERENCIA}
  sheets:
    webapp-url: ${GOOGLE_SHEETS_WEBAPP_URL:https://script.google.com/macros/s/AKfycbzMkCg7PfddRA048GAZBc5jz_2lKpmtJg13589XteWmONKBiQBQLKZxw-eBeEwa0uDslw/exec}
    sync-interval-ms: ${SHEETS_SYNC_INTERVAL_MS:300000}
  ai:
    quote:
      # Precio base por persona (COP) cuando el chat no menciona un monto.
      base-price-per-person: ${AI_QUOTE_BASE_PRICE:75000}
      # Confianza minima (0-100) para ofrecer generar la cotizacion automaticamente.
      min-confidence: ${AI_QUOTE_MIN_CONFIDENCE:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info
