<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" role="img" aria-label="Ave Escuela Aves Salento">
  <!-- Soft forest glow -->
  <defs>
    <radialGradient id="qsGlow" cx="55%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a6b4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a3d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qsChest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#f0bc3a"/>
      <stop offset="100%" stop-color="#e8a31a"/>
    </linearGradient>
    <linearGradient id="qsHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="qsWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <ellipse cx="190" cy="150" rx="120" ry="100" fill="url(#qsGlow)"/>

  <!-- Branch -->
  <path d="M40 210 C110 198 170 205 250 188 C270 184 290 178 310 172" stroke="#8b6914" stroke-width="7" stroke-linecap="round"/>
  <path d="M40 210 C110 198 170 205 250 188" stroke="#c4a35a" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Tail -->
  <path d="M220 168 C248 150 268 128 278 108 C262 128 248 148 228 162 Z" fill="#0f766e"/>
  <path d="M226 172 C250 158 272 142 286 124 C268 144 252 160 232 170 Z" fill="#14b8a6" opacity="0.85"/>

  <!-- Body -->
  <ellipse cx="168" cy="148" rx="58" ry="48" fill="url(#qsChest)"/>
  <ellipse cx="152" cy="138" rx="36" ry="30" fill="#fff3bf" opacity="0.35"/>

  <!-- Wing -->
  <path d="M168 128 C198 118 218 132 224 158 C228 178 214 192 188 186 C170 182 158 168 156 150 C154 138 160 130 168 128 Z" fill="url(#qsWing)"/>
  <path d="M176 138 C196 132 208 142 212 156" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M172 150 C190 146 202 154 206 166" stroke="#a7f3d0" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>

  <!-- Head -->
  <ellipse cx="118" cy="112" rx="42" ry="38" fill="url(#qsHead)"/>
  <path d="M90 108 C98 88 120 78 138 86 C124 90 112 100 108 114 Z" fill="#99f6e4" opacity="0.45"/>

  <!-- Beak -->
  <path d="M78 118 L52 122 L78 128 Z" fill="#1c1917"/>
  <path d="M78 118 L58 121.5 L78 123.5 Z" fill="#44403c"/>

  <!-- Eye -->
  <ellipse cx="104" cy="108" rx="7.5" ry="8" fill="#0a0a0a"/>
  <circle cx="106.5" cy="105.5" r="2.2" fill="#fff"/>

  <!-- Mask / cheek -->
  <path d="M88 118 C96 126 112 128 124 122" stroke="#042f2e" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Feet -->
  <path d="M150 188 L146 208 M150 188 L156 208 M164 190 L160 210 M164 190 L170 210" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>

  <!-- Brand accent spiral (tiny mark echo) -->
  <path d="M248 78 C262 82 270 94 266 106 C263 114 254 120 244 118" stroke="#e8a31a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
