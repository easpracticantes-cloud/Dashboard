<header class="tb">
  <button type="button" class="tb__icon-btn lg-hide" (click)="menuToggle.emit()" aria-label="Abrir menú">
    <mat-icon>menu</mat-icon>
  </button>

  <button type="button" class="tb__search sm-show" (click)="openCommand.emit()">
    <mat-icon>search</mat-icon>
    <span>Buscar cliente, chat o módulo…</span>
    <kbd>Ctrl K</kbd>
  </button>

  <div class="tb__actions">
    <button
      type="button"
      class="tb__sync"
      (click)="syncNow()"
      [disabled]="liveSync.syncing()"
      [title]="liveSync.lastSyncAt() ? ('Última sync: ' + (liveSync.lastSyncAt() | date: 'HH:mm:ss')) : 'Sincronizar Google Sheets'"
    >
      <mat-icon [class.tb__sync-spin]="liveSync.syncing()">sync</mat-icon>
      <span class="sm-show">{{ syncLabel() }}</span>
    </button>

    <button
      type="button"
      class="tb__icon-btn"
      [matMenuTriggerFor]="notifMenu"
      [matBadge]="unread() > 0 ? unread() : null"
      matBadgeColor="warn"
      matBadgeSize="small"
      aria-label="Notificaciones"
    >
      <mat-icon>notifications</mat-icon>
    </button>

    <mat-menu #notifMenu="matMenu" class="tb-menu">
      <div class="tb-notif" (click)="$event.stopPropagation()">
        <div class="tb-notif__head">
          <strong>Notificaciones</strong>
          <button type="button" class="text-xs font-semibold text-eas-leaf hover:underline" (click)="notifications.markAllAsRead()">
            Marcar leídas
          </button>
        </div>
        <div class="tb-notif__list">
          @for (n of notifications.notifications().slice(0, 6); track n.id) {
            <div class="tb-notif__item" [class.unread]="!n.read">
              <span class="tb-notif__dot"></span>
              <span class="tb-notif__copy">
                <span class="tb-notif__title">{{ n.title }}</span>
                @if (n.body) {
                  <span class="tb-notif__body">{{ n.body }}</span>
                }
                <span class="tb-notif__time">{{ n.createdAt | timeAgo }}</span>
              </span>
              <button type="button" class="tb-notif__action" (click)="openNotification(n, $event)">
                {{ actionLabel(n) }}
              </button>
            </div>
          } @empty {
            <p class="tb-notif__empty">Sin notificaciones.</p>
          }
        </div>
        <a routerLink="/app/notifications" class="tb-notif__all">Ver todas</a>
      </div>
    </mat-menu>

    <button
      type="button"
      class="tb__icon-btn tb__theme"
      (click)="toggleTheme()"
      [attr.aria-label]="theme.toggleLabel()"
      [title]="theme.toggleLabel()"
    >
      <mat-icon>{{ theme.toggleIcon() }}</mat-icon>
      <span class="tb__theme-label sm-show">{{ theme.isDark() ? 'Claro' : 'Oscuro' }}</span>
    </button>

    <button type="button" class="tb__user" [matMenuTriggerFor]="userMenu">
      <eas-avatar [name]="user()?.nombre ?? ''" [imageUrl]="user()?.avatarUrl" [size]="32"></eas-avatar>
      <span class="tb__user-text sm-show">
        <span>{{ user()?.nombre }}</span>
        <span>{{ roleLabel() }}</span>
      </span>
      <mat-icon class="sm-show">expand_more</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <a mat-menu-item routerLink="/app/profile">
        <mat-icon>person</mat-icon>
        <span>Mi perfil</span>
      </a>
      <a mat-menu-item routerLink="/app/settings">
        <mat-icon>settings</mat-icon>
        <span>Configuración</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</header>
