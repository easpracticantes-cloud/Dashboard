<div class="uf">
  <div class="uf__head">
    <div>
      <p class="uf__eyebrow">{{ isEdit ? 'Editar' : 'Alta' }}</p>
      <h2>{{ isEdit ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    </div>
    <button type="button" (click)="cancel()" class="uf__close" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="uf__grid">
      <label>
        Usuario
        <input type="text" formControlName="username" [readonly]="isEdit" autocomplete="off" placeholder="nombre.apellido" />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small>Mínimo 3 caracteres.</small>
        }
      </label>
      <label>
        Correo
        <input type="email" formControlName="email" autocomplete="email" placeholder="nombre@eas.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small>Correo válido.</small>
        }
      </label>
    </div>

    <label>
      Nombre completo
      <input type="text" formControlName="fullName" autocomplete="name" />
    </label>

    <label>
      Rol
      <select formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ roleLabels[role] }}</option>
        }
      </select>
      <small class="uf__hint">{{ roleHint }}</small>
    </label>

    <label>
      Contraseña {{ isEdit ? '(déjala vacía para no cambiarla)' : '' }}
      <span class="uf__pass">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
        <button type="button" (click)="showPassword.set(!showPassword())">
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </span>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Mínimo 8 caracteres.</small>
      }
    </label>

    <label class="uf__check">
      <input type="checkbox" formControlName="active" />
      Usuario activo (puede iniciar sesión)
    </label>

    <div class="uf__actions">
      <button type="button" class="eas-btn-secondary" (click)="cancel()">Cancelar</button>
      <button type="submit" class="eas-btn-primary">{{ isEdit ? 'Guardar cambios' : 'Crear usuario' }}</button>
    </div>
  </form>
</div>
