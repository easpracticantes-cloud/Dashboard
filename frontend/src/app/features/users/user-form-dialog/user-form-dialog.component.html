<div class="w-[min(92vw,460px)] p-1">
  <div class="mb-5 flex items-center justify-between">
    <h2 class="font-display text-xl text-eas-ink">{{ isEdit ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    <button type="button" (click)="cancel()" class="grid h-8 w-8 place-items-center rounded-full text-eas-muted hover:bg-eas-mist">
      <mat-icon [style.font-size.px]="18" [style.width.px]="18" [style.height.px]="18">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-eas-ink">Usuario</label>
        <input
          type="text"
          formControlName="username"
          [readonly]="isEdit"
          class="w-full rounded-xl border border-eas-forest/12 bg-eas-snow px-3.5 py-2.5 text-sm text-eas-ink focus:border-eas-leaf focus:bg-white focus:outline-none focus:ring-2 focus:ring-eas-leaf/20 disabled:opacity-60"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-eas-ink">Correo</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-xl border border-eas-forest/12 bg-eas-snow px-3.5 py-2.5 text-sm text-eas-ink focus:border-eas-leaf focus:bg-white focus:outline-none focus:ring-2 focus:ring-eas-leaf/20"
        />
      </div>
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-semibold text-eas-ink">Nombre completo</label>
      <input
        type="text"
        formControlName="fullName"
        class="w-full rounded-xl border border-eas-forest/12 bg-eas-snow px-3.5 py-2.5 text-sm text-eas-ink focus:border-eas-leaf focus:bg-white focus:outline-none focus:ring-2 focus:ring-eas-leaf/20"
      />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-eas-ink">Rol</label>
        <select
          formControlName="role"
          class="w-full rounded-xl border border-eas-forest/12 bg-eas-snow px-3.5 py-2.5 text-sm text-eas-ink focus:border-eas-leaf focus:outline-none focus:ring-2 focus:ring-eas-leaf/20"
        >
          @for (role of roles; track role) {
            <option [value]="role">{{ roleLabels[role] }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-eas-ink">Contraseña {{ isEdit ? '(opcional)' : '' }}</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-xl border border-eas-forest/12 bg-eas-snow px-3.5 py-2.5 text-sm text-eas-ink focus:border-eas-leaf focus:bg-white focus:outline-none focus:ring-2 focus:ring-eas-leaf/20"
        />
      </div>
    </div>
    <label class="flex items-center gap-2.5 text-sm font-medium text-eas-ink">
      <input type="checkbox" formControlName="active" class="h-4 w-4 rounded border-eas-forest/30 text-eas-forest focus:ring-eas-leaf/30" />
      Usuario activo
    </label>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" (click)="cancel()" class="rounded-full px-4 py-2.5 text-sm font-semibold text-eas-muted hover:bg-eas-mist">
        Cancelar
      </button>
      <button type="submit" class="rounded-full bg-eas-brand px-5 py-2.5 text-sm font-semibold text-eas-on-brand hover:bg-eas-brand-hover">
        Guardar
      </button>
    </div>
  </form>
</div>
