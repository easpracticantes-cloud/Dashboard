<div class="fp">
  <div class="fp__bg" aria-hidden="true">
    <div class="fp__photo"></div>
    <div class="fp__veil"></div>
  </div>

  <div class="fp__card eas-animate-rise">
    <div class="fp__brand">
      <eas-brand-logo variant="mark" [height]="44"></eas-brand-logo>
    </div>

    @if (!sent()) {
      <p class="fp__eyebrow">Recuperar acceso</p>
      <h1>Restablece tu contraseña</h1>
      <p class="fp__sub">Te enviaremos un enlace al correo corporativo registrado en el SIG.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="fp__form">
        <label class="field">
          <span>Correo corporativo</span>
          <div class="field__control">
            <mat-icon>mail_outline</mat-icon>
            <input
              class="eas-input"
              id="email"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="nombre@escuelaavessalento.com"
              [class.is-invalid]="email.invalid && email.touched"
            />
          </div>
          @if (email.invalid && email.touched) {
            <small>Ingresa un correo válido.</small>
          }
        </label>

        <button type="submit" class="eas-btn-primary fp__submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="18" strokeWidth="2"></mat-spinner>
            Enviando…
          } @else {
            Enviar enlace
            <mat-icon>send</mat-icon>
          }
        </button>
      </form>
    } @else {
      <div class="fp__success">
        <div class="fp__success-icon">
          <mat-icon>mark_email_read</mat-icon>
        </div>
        <h2>Revisa tu correo</h2>
        <p>Si el correo existe en el sistema, recibirás el enlace en unos minutos.</p>
      </div>
    }

    <a routerLink="/login" class="fp__back">
      <mat-icon>arrow_back</mat-icon>
      Volver al inicio de sesión
    </a>
  </div>
</div>
