<div class="aqr" role="dialog" aria-modal="true" aria-label="Revisar cotización">
  <div class="aqr__backdrop" (click)="close()"></div>
  <section class="aqr__panel">
    <header class="aqr__head">
      <div>
        <p class="aqr__eyebrow">Cotización Escuela Aves</p>
        <h2>{{ editing() ? 'Editar cotización' : 'Vista previa' }}</h2>
      </div>
      <div class="aqr__head-tools">
        <label class="aqr__status">
          <span>Estado</span>
          <select [ngModel]="doc().status" (ngModelChange)="setStatus($event)">
            @for (st of statuses; track st) {
              <option [value]="st">{{ st }}</option>
            }
          </select>
        </label>
        <button type="button" class="aqr__x" (click)="close()" aria-label="Cerrar">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </header>

    @if (reviewFlag()) {
      <p class="aqr__warn">
        <mat-icon>warning</mat-icon>
        Esta tarifa está marcada para revisión comercial en el catálogo.
      </p>
    }

    <div class="aqr__toolbar">
      <button type="button" class="aqr__btn" [class.aqr__btn--soft]="editing()" (click)="edit()">
        <mat-icon>edit</mat-icon>
        Editar
      </button>
      <button type="button" class="aqr__btn" [class.aqr__btn--soft]="!editing()" (click)="preview()">
        <mat-icon>visibility</mat-icon>
        Vista previa
      </button>
      <button type="button" class="aqr__btn aqr__btn--soft" [disabled]="saving()" (click)="save()">
        <mat-icon>save</mat-icon>
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
      <button type="button" class="aqr__btn aqr__btn--primary" [disabled]="downloading()" (click)="downloadPdf()">
        <mat-icon>picture_as_pdf</mat-icon>
        {{ downloading() ? 'Generando…' : 'PDF' }}
      </button>
      <button type="button" class="aqr__btn aqr__btn--soft" (click)="printSheet()" title="Imprimir">
        <mat-icon>print</mat-icon>
        Imprimir
      </button>
      <button type="button" class="aqr__btn aqr__btn--soft" (click)="copySummary()" title="Copiar resumen">
        <mat-icon>content_copy</mat-icon>
        {{ copied() ? 'Copiado' : 'Copiar' }}
      </button>
      <button type="button" class="aqr__btn aqr__btn--soft" (click)="shareWhatsApp()" title="Enviar por WhatsApp">
        <mat-icon>chat</mat-icon>
        WhatsApp
      </button>
      <button type="button" class="aqr__btn aqr__btn--ghost" (click)="resetDraft()" title="Nueva cotización en blanco">
        <mat-icon>restart_alt</mat-icon>
        Limpiar
      </button>
      @if (reviewed()) {
        <span class="aqr__ok"><mat-icon>task_alt</mat-icon> Guardada</span>
      }
    </div>

    @if (toast()) {
      <p class="aqr__toast">{{ toast() }}</p>
    }

    @if (formError()) {
      <p class="aqr__dl-error">{{ formError() }}</p>
    }

    <div class="aqr__sheet-wrap" [class.aqr__sheet-wrap--preview]="!editing()">
      <eas-quote-sheet [document]="doc()" [editing]="editing()" (documentChange)="onDocumentChange($event)" />
    </div>
  </section>
</div>
