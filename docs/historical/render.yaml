# HISTÓRICO — Blueprint Render (NO usar para desplegar)
# Producción actual: Oracle Cloud + docker-compose.yml
# Ver docs/ORACLE_DEPLOYMENT.md
#
# Original (referencia de la arquitectura previa):
#
# Servicios:
#   - dashboard-frontend (Static Site Angular)
#   - sig-contabilidad   (FastAPI Contabilidad IA)
#
# Backend Java (dashboard-7spt) en Render usaba:
#   CONTABLE_API_BASE = URL pública de sig-contabilidad
#   GEMINI_API_KEY / CORS_ALLOWED_ORIGINS / etc.

services:
  - type: web
    name: dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/eas-sig-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /runtime-config.json
        name: Cache-Control
        value: no-store

  - type: web
    name: sig-contabilidad
    runtime: docker
    dockerfilePath: ./contabilidad-service/Dockerfile
    dockerContext: ./contabilidad-service
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_HOST
        value: "0.0.0.0"
      - key: APP_OPEN_BROWSER
        value: "0"
      - key: APP_CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////app/data/contable.db
      - key: STORAGE_ROOT
        value: /app/storage
      - key: STORAGE_PROVIDER
        value: local
      - key: AI_PROVIDER
        value: gemini
      - key: APP_AI_PROVIDER
        value: gemini
      - key: OLLAMA_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-latest,gemini-flash-latest
      - key: TESSERACT_LANG
        value: spa+eng
      - key: LOG_LEVEL
        value: INFO
