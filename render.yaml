# Blueprint Render — Frontend SPA + variables necesarias del backend
#
# Frontend Static Site: rewrite /* → /index.html
# Backend (servicio Java existente dashboard-7spt): configurar en Dashboard → Environment:
#   GEMINI_API_KEY=<tu key>
#   GEMINI_MODEL=gemini-3.6-flash
#   APP_AI_PROVIDER=gemini
#   CORS_ALLOWED_ORIGINS=https://dashboard-frontend.onrender.com,https://*.onrender.com,http://localhost:4200

services:
  - type: web
    name: dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/eas-sig-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /runtime-config.json
        name: Cache-Control
        value: no-store
