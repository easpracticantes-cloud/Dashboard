# Blueprint Render — Frontend SPA (Angular)
# Si el Static Site ya existe en el Dashboard, también puedes añadir
# Redirects/Rewrites → Source: /*  Destination: /index.html  Action: Rewrite

services:
  - type: web
    name: dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/eas-sig-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
