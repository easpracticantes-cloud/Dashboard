name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular (production + base-href)
        working-directory: frontend
        run: npx ng build --configuration=production --base-href=/Dashboard/

      - name: Prepare gh-pages publish folder
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Angular 17+ application builder output
          cp -r frontend/dist/eas-sig-frontend/browser/. _site/
          # SPA fallback: GitHub Pages sirve 404.html en rutas profundas
          cp _site/index.html _site/404.html
          # Evita que Jekyll ignore carpetas/archivos con guion bajo
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy Angular frontend to GitHub Pages'
