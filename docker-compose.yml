# SIG — producción Oracle Cloud (Docker Compose)
# Solo el frontend (Nginx) debe publicarse. db / backend / contabilidad = red interna.

services:
  db:
    image: postgres:16
    container_name: sig_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sig_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sig_net
    # NO publicar 5432 a Internet. Para depuración local usa docker-compose.dev.yml

  backend:
    build:
      context: ./backend
    image: sig-backend:latest
    container_name: sig_backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8080
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      JWT_REMEMBER_ME_EXPIRATION_MINUTES: ${JWT_REMEMBER_ME_EXPIRATION_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      GOOGLE_DEFAULT_ROLE: ${GOOGLE_DEFAULT_ROLE:-GERENCIA}
      GOOGLE_SHEETS_WEBAPP_URL: ${GOOGLE_SHEETS_WEBAPP_URL:-}
      GOOGLE_SHEETS_WRITE_TOKEN: ${GOOGLE_SHEETS_WRITE_TOKEN:-}
      SHEETS_SYNC_INTERVAL_MS: ${SHEETS_SYNC_INTERVAL_MS:-300000}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-anthropic}
      AI_PROVIDER: ${APP_AI_PROVIDER:-anthropic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-latest,gemini-flash-latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-claude-haiku-4-5-20251001}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-claude-sonnet-4-5-20250929}
      CONTABLE_API_BASE: ${CONTABLE_API_BASE:-http://contabilidad:8787}
    depends_on:
      db:
        condition: service_healthy
      contabilidad:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sig_net
    # NO publicar 8080. El acceso externo es via Nginx (frontend) → /api/

  contabilidad:
    build:
      context: ./contabilidad-service
    image: sig-contabilidad:latest
    container_name: sig_contabilidad
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8787
      PORT: 8787
      APP_OPEN_BROWSER: "0"
      APP_CORS_ORIGINS: ${CONTABILIDAD_CORS_ORIGINS:-*}
      DATABASE_URL: sqlite:////app/data/contable.db
      STORAGE_ROOT: /app/storage
      STORAGE_PROVIDER: local
      AI_PROVIDER: ${APP_AI_PROVIDER:-anthropic}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-anthropic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-latest,gemini-flash-latest}
      GEMINI_VISION_ON_WEAK_OCR: ${GEMINI_VISION_ON_WEAK_OCR:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-claude-haiku-4-5-20251001}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-claude-sonnet-4-5-20250929}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      TESSERACT_LANG: ${TESSERACT_LANG:-spa+eng}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - contabilidad_data:/app/data
      - contabilidad_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - sig_net
    # NO publicar 8787. Spring Boot llama http://contabilidad:8787 en la red Docker.

  frontend:
    build:
      context: ./frontend
    image: sig-frontend:latest
    container_name: sig_frontend
    restart: unless-stopped
    ports:
      # Único puerto público de la app (HTTP). HTTPS vía Certbot/Nginx del host o 443→80.
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sig_net

networks:
  sig_net:
    driver: bridge

volumes:
  sig_postgres_data:
  contabilidad_data:
  contabilidad_storage:
