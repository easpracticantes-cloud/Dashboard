services:
  db:
    image: postgres:16
    container_name: sig_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Flyway (backend) crea schema + tablas al arrancar; no montar SQL aquí.
      - sig_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: sig-backend:latest
    container_name: sig_backend
    restart: on-failure
    environment:
      BACKEND_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      JWT_REMEMBER_ME_EXPIRATION_MINUTES: ${JWT_REMEMBER_ME_EXPIRATION_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4200,https://dashboard-frontend.onrender.com,https://*.onrender.com}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      GOOGLE_DEFAULT_ROLE: ${GOOGLE_DEFAULT_ROLE:-GERENCIA}
      GOOGLE_SHEETS_WEBAPP_URL: ${GOOGLE_SHEETS_WEBAPP_URL:-https://script.google.com/macros/s/AKfycbzMkCg7PfddRA048GAZBc5jz_2lKpmtJg13589XteWmONKBiQBQLKZxw-eBeEwa0uDslw/exec}
      SHEETS_SYNC_INTERVAL_MS: ${SHEETS_SYNC_INTERVAL_MS:-300000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-gemini}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: sig-frontend:latest
    container_name: sig_frontend
    restart: on-failure
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  sig_postgres_data:
